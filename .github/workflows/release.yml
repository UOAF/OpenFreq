name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test OpenFreq.sln --no-restore

  build-server:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          for RID in win-x64 linux-x64; do
            for SC in true false; do
              SUFFIX=$([[ "$SC" == "true" ]] && echo "portable" || echo "framework")
              OUTDIR="publish/OpenFreq-Server-${RID}-${SUFFIX}"
              SC_FLAGS=$([[ "$SC" == "true" ]] && echo "-p:PublishSingleFile=true -p:PublishTrimmed=true" || echo "")
              dotnet publish OpenFreq.Server/OpenFreq.Server.csproj \
                -c Release -r "$RID" --self-contained "$SC" \
                $SC_FLAGS \
                -p:DebugType=none -p:DebugSymbols=false \
                -p:InformationalVersion="$VERSION" \
                -o "$OUTDIR"
              pushd "$OUTDIR"
              zip -r "$GITHUB_WORKSPACE/OpenFreq-Server-${{ github.ref_name }}-${RID}-${SUFFIX}.zip" . --exclude "*.pdb"
              popd
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: server-builds
          path: OpenFreq-Server-*.zip
          retention-days: 1

  build-client:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          for RID in win-x64 linux-x64; do
            for SC in true false; do
              SUFFIX=$([[ "$SC" == "true" ]] && echo "portable" || echo "framework")
              OUTDIR="publish/OpenFreq-Client-${RID}-${SUFFIX}"
              SC_FLAGS=$([[ "$SC" == "true" ]] && echo "-p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true" || echo "")
              dotnet publish OpenFreq.Client/OpenFreq.Client.csproj \
                -c Release -r "$RID" --self-contained "$SC" \
                $SC_FLAGS \
                -p:DebugType=none -p:DebugSymbols=false \
                -p:InformationalVersion="$VERSION" \
                -o "$OUTDIR"
              if [[ "$RID" == "win-x64" ]]; then
                cp libs/OpenFreqAudio/OpenFreqAudio/Assets/windows/*.dll "$OUTDIR/"
              else
                cp libs/OpenFreqAudio/OpenFreqAudio/Assets/linux/*.so "$OUTDIR/"
              fi
              pushd "$OUTDIR"
              zip -r "$GITHUB_WORKSPACE/OpenFreq-Client-${{ github.ref_name }}-${RID}-${SUFFIX}.zip" . --exclude "*.pdb"
              popd
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: client-builds
          path: OpenFreq-Client-*.zip
          retention-days: 1

  release:
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenFreq ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 📦 Portable

            No .NET install needed, unzip and run. Larger files.

            |  | 🪟 Windows | 🐧 Linux |
            |---|---|---|
            | **Client** | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Client-${{ github.ref_name }}-win-x64-portable.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Client-${{ github.ref_name }}-linux-x64-portable.zip) |
            | **Server** | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Server-${{ github.ref_name }}-win-x64-portable.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Server-${{ github.ref_name }}-linux-x64-portable.zip) |

            ## ⚙️ .NET 10 Required

            Smaller download, needs the [.NET 10 runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed.

            |  | 🪟 Windows | 🐧 Linux |
            |---|---|---|
            | **Client** | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Client-${{ github.ref_name }}-win-x64-framework.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Client-${{ github.ref_name }}-linux-x64-framework.zip) |
            | **Server** | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Server-${{ github.ref_name }}-win-x64-framework.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Server-${{ github.ref_name }}-linux-x64-framework.zip) |
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
