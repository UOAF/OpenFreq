name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          for RID in win-x64 linux-x64; do
            for SC in true false; do
              SUFFIX=$([[ "$SC" == "true" ]] && echo "selfcontained" || echo "framework")
              OUTDIR="publish/OpenFreq-Server-${RID}-${SUFFIX}"
              SC_FLAGS=$([[ "$SC" == "true" ]] && echo "-p:PublishSingleFile=true -p:PublishTrimmed=true" || echo "")
              dotnet publish OpenFreq.Server/OpenFreq.Server.csproj \
                -c Release -r "$RID" --self-contained "$SC" \
                $SC_FLAGS \
                -p:DebugType=none -p:DebugSymbols=false \
                -p:InformationalVersion="$VERSION" \
                -o "$OUTDIR"
              pushd "$OUTDIR"
              zip -r "$GITHUB_WORKSPACE/OpenFreq-Server-${VERSION}-${RID}-${SUFFIX}.zip" . --exclude "*.pdb"
              popd
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: server-builds
          path: OpenFreq-Server-*.zip
          retention-days: 1

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          for RID in win-x64 linux-x64; do
            for SC in true false; do
              SUFFIX=$([[ "$SC" == "true" ]] && echo "selfcontained" || echo "framework")
              OUTDIR="publish/OpenFreq-Client-${RID}-${SUFFIX}"
              SC_FLAGS=$([[ "$SC" == "true" ]] && echo "-p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true" || echo "")
              dotnet publish OpenFreq.Client/OpenFreq.Client.csproj \
                -c Release -r "$RID" --self-contained "$SC" \
                $SC_FLAGS \
                -p:DebugType=none -p:DebugSymbols=false \
                -p:InformationalVersion="$VERSION" \
                -o "$OUTDIR"
              if [[ "$RID" == "win-x64" ]]; then
                cp libs/OpenFreqAudio/OpenFreqAudio/Assets/windows/*.dll "$OUTDIR/"
              else
                cp libs/OpenFreqAudio/OpenFreqAudio/Assets/linux/*.so "$OUTDIR/"
              fi
              pushd "$OUTDIR"
              zip -r "$GITHUB_WORKSPACE/OpenFreq-Client-${VERSION}-${RID}-${SUFFIX}.zip" . --exclude "*.pdb"
              popd
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: client-builds
          path: OpenFreq-Client-*.zip
          retention-days: 1

  release:
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenFreq ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Archive | Platform | Mode |
            |---|---|---|
            | `OpenFreq-Server-win-x64-selfcontained.zip` | Windows | Self-contained (.NET bundled) |
            | `OpenFreq-Server-win-x64-framework.zip` | Windows | Requires .NET 10 |
            | `OpenFreq-Server-linux-x64-selfcontained.zip` | Linux | Self-contained (.NET bundled) |
            | `OpenFreq-Server-linux-x64-framework.zip` | Linux | Requires .NET 10 |
            | `OpenFreq-Client-win-x64-selfcontained.zip` | Windows | Self-contained (.NET bundled) |
            | `OpenFreq-Client-win-x64-framework.zip` | Windows | Requires .NET 10 |
            | `OpenFreq-Client-linux-x64-selfcontained.zip` | Linux | Self-contained (.NET bundled) |
            | `OpenFreq-Client-linux-x64-framework.zip` | Linux | Requires .NET 10 |
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
