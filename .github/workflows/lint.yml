name: Lint

on:
  pull_request:
    branches: [develop, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Lint (whitespace + style + analyzers)
        run: dotnet format --verify-no-changes --no-restore --exclude libs/OpenFreqAudio

      - name: Build (warnings as errors)
        run: |
          for proj in OpenFreq.Common/OpenFreq.Common.csproj \
                      OpenFreq.Client/OpenFreq.Client.csproj \
                      OpenFreq.Server/OpenFreq.Server.csproj \
                      OpenFreq.Testclient/OpenFreq.Testclient.csproj \
                      OpenFreq.Common.Tests/OpenFreq.Common.Tests.csproj \
                      OpenFreq.Server.Tests/OpenFreq.Server.Tests.csproj \
                      OpenFreq.Client.Tests/OpenFreq.Client.Tests.csproj; do
            dotnet build "$proj" --no-restore -warnaserror
          done

      - name: Test
        run: dotnet test OpenFreq.sln --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverage.runsettings

      - name: Merge Coverage Reports
        run: |
          dotnet tool install -g dotnet-coverage
          dotnet-coverage merge "coverage/**/coverage.cobertura.xml" --output coverage/merged.cobertura.xml --output-format cobertura

      - name: Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/merged.cobertura.xml
          badge: true
          format: markdown
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Post Coverage Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
